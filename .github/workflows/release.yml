name: Release

# Builds the desktop client for macOS, Windows, and Linux when a version tag is
# pushed (v0.1.0-beta.1, v1.2.0, …), packages each build, writes SHA-256
# checksums, and publishes a GitHub Release. Tags containing a hyphen become
# pre-releases. `workflow_dispatch` runs the same matrix without publishing so
# the packaging can be verified on every platform before a tag exists.
#
# Windows and Linux are packed with Velopack (vpk): a Setup.exe, a portable
# ZIP, and an AppImage, plus the `releases.{win,linux}.json` feeds and
# `.nupkg` packages the installed app reads to update itself. The feeds must
# stay attached to the GitHub release. macOS keeps the DMG because the
# sandboxed app cannot be replaced by Velopack; it only shows a hint.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: MAICENTA
  FLUTTER_CHANNEL: stable
  # Must equal the `velopack` crate version in core/bridge/Cargo.toml; the
  # packages and the in-app updater are released together.
  VPK_VERSION: 1.2.161

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target: macos
            artifact: macos
          - os: windows-latest
            label: Windows
            target: windows
            artifact: windows
          # Pinned instead of ubuntu-latest: the bundle links against the
          # runner's glibc and WebKitGTK, so an older base keeps it runnable on
          # current LTS distributions.
          - os: ubuntu-24.04
            label: Linux
            target: linux
            artifact: linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from tag or pubspec
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(grep -E '^version:' apps/client_flutter/pubspec.yaml | sed -E 's/^version: *([^+ ]+).*/\1/')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      - name: Verify the tag matches pubspec.yaml and build_version.dart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pubspec="$(grep -E '^version:' apps/client_flutter/pubspec.yaml | sed -E 's/^version: *([^+ ]+).*/\1/')"
          constant="$(grep -oE "maicentaVersion = '[^']+'" apps/client_flutter/lib/build_version.dart | sed -E "s/.*'([^']+)'/\1/")"
          for value in "${pubspec}" "${constant}"; do
            if [[ "${value}" != "${{ steps.version.outputs.version }}" ]]; then
              echo "version ${value} does not match tag ${{ steps.version.outputs.version }}" >&2
              exit 1
            fi
          done

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang cmake pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libssl-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev

      # SQLCipher builds a vendored OpenSSL, whose Configure script needs a
      # full Perl. The bash shell finds Git's MSYS Perl first, which lacks the
      # required modules, so point openssl-src at the preinstalled Strawberry
      # Perl instead.
      - name: Use Strawberry Perl for OpenSSL
        if: matrix.target == 'windows'
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "${GITHUB_ENV}"

      # Cargokit builds below build\windows\x64\plugins\maicenta_bridge\,
      # where OpenSSL's source tree exceeds the 260-character path limit and
      # Configure reports files as missing. A short temp directory avoids it.
      - name: Shorten the Rust build path
        if: matrix.target == 'windows'
        run: echo "CARGOKIT_TEMP_DIR=$(cygpath -m "${RUNNER_TEMP}")/ck" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable desktop targets
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Resolve dependencies
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Build release
        working-directory: apps/client_flutter
        run: flutter build ${{ matrix.target }} --release

      # ------------------------------------------------------------------
      # Packaging
      # ------------------------------------------------------------------
      - name: Package macOS DMG
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          app="apps/client_flutter/build/macos/Build/Products/Release/${APP_NAME}.app"
          staging="$(mktemp -d)"
          cp -R "${app}" "${staging}/"
          ln -s /Applications "${staging}/Applications"
          cat > "${staging}/Erste Schritte.txt" <<'TXT'
          MAICENTA Beta für macOS

          Diese Vorabversion ist noch nicht von Apple beglaubigt. Beim ersten
          Start meldet macOS deshalb, die App könne nicht geöffnet werden.

          So startest du sie trotzdem:
            1. MAICENTA in den Ordner „Programme“ ziehen.
            2. Im Finder mit der rechten Maustaste auf MAICENTA klicken und
               „Öffnen“ wählen. Den Hinweis mit „Öffnen“ bestätigen.
            3. Falls die Meldung bleibt: Systemeinstellungen → Datenschutz &
               Sicherheit → unten bei MAICENTA auf „Dennoch öffnen“ klicken.

          Prüfsumme und Hinweise: https://github.com/Tim0theus/maicenta/releases
          TXT
          mkdir -p dist
          hdiutil create -volname "${APP_NAME} ${version}" -srcfolder "${staging}" \
            -ov -format UDZO "dist/${APP_NAME}-${version}-macos.dmg"

      - name: Extract release notes
        run: .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Install Velopack CLI
        if: matrix.target != 'macos'
        run: |
          set -euo pipefail
          crate="$(grep -oE '^velopack = "=[^"]+"' core/bridge/Cargo.toml | sed -E 's/.*"=([^"]+)"/\1/')"
          if [[ "${crate}" != "${VPK_VERSION}" ]]; then
            echo "velopack crate ${crate} does not match VPK_VERSION ${VPK_VERSION}" >&2
            exit 1
          fi
          dotnet tool install vpk --version "${VPK_VERSION}" --tool-path "${RUNNER_TEMP}/vpk"
          echo "VPK=${RUNNER_TEMP}/vpk/vpk" >> "${GITHUB_ENV}"

      # Earlier releases on the same channel let vpk build a small delta
      # package. The first Velopack release has none; vpk then packs a full
      # release only.
      - name: Download the previous Velopack release
        if: matrix.target != 'macos'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          channel="${{ matrix.target == 'windows' && 'win' || 'linux' }}"
          pre=()
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then pre=(--pre); fi
          mkdir -p releases
          "${VPK}" download github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" \
            --token "${GITHUB_TOKEN}" --channel "${channel}" "${pre[@]}" --outputDir releases \
            || echo "::notice::No earlier Velopack release on ${channel}; packing without a delta."
          touch "${RUNNER_TEMP}/before-pack"

      - name: Package Windows installer
        if: matrix.target == 'windows'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          "${VPK}" pack --packId "${APP_NAME}" --packVersion "${version}" \
            --packTitle "${APP_NAME}" --packAuthors "MAICENTA contributors" \
            --packDir apps/client_flutter/build/windows/x64/runner/Release \
            --mainExe maicenta.exe \
            --icon apps/client_flutter/windows/runner/resources/app_icon.ico \
            --releaseNotes release-notes.md --channel win --outputDir releases

      - name: Package Linux AppImage
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          "${VPK}" pack --packId "${APP_NAME}" --packVersion "${version}" \
            --packTitle "${APP_NAME}" --packAuthors "MAICENTA contributors" \
            --packDir apps/client_flutter/build/linux/x64/release/bundle \
            --mainExe maicenta \
            --icon assets/branding/maicenta-symbol.png \
            --releaseNotes release-notes.md --channel linux --outputDir releases

      # Only the files this run produced are published; packages downloaded
      # for the delta already belong to an earlier release. Installers get
      # versioned names, while feed and package names stay as vpk wrote them
      # because the feeds reference them.
      - name: Collect Velopack output
        if: matrix.target != 'macos'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          find releases -maxdepth 1 -type f -newer "${RUNNER_TEMP}/before-pack" -exec cp {} dist/ \;
          cd dist
          rename() { if [[ -f "$1" ]]; then mv "$1" "$2"; fi; }
          rename "${APP_NAME}-win-Setup.exe" "${APP_NAME}-${version}-windows-x64-Setup.exe"
          rename "${APP_NAME}-win-Portable.zip" "${APP_NAME}-${version}-windows-x64-portable.zip"
          rename "${APP_NAME}.AppImage" "${APP_NAME}-${version}-linux-x64.AppImage"
          ls -la
          compgen -G "releases.*.json" >/dev/null || { echo "vpk wrote no release feed" >&2; exit 1; }
          compgen -G "*-full.nupkg" >/dev/null || { echo "vpk wrote no full package" >&2; exit 1; }

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          for file in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "${file}" > "${file}.sha256"
            else
              shasum -a 256 "${file}" > "${file}.sha256"
            fi
          done
          cat ./*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Each platform's files must have unique names, or one would silently
      # replace another in the release.
      - name: Merge platform artifacts
        run: |
          set -euo pipefail
          duplicates="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [[ -n "${duplicates}" ]]; then
            echo "Several platforms produced: ${duplicates}" >&2
            exit 1
          fi
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
      - name: Combine checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS.txt
          rm ./*.sha256
          ls -la
      - name: Write release notes
        run: |
          set -euo pipefail
          .github/scripts/release-notes.sh "${GITHUB_REF#refs/tags/v}" > release-notes.md
          cat .github/release-install-notes.md >> release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: MAICENTA ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
