name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and validate content
        run: npm run check
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://maicenta.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist
      # Requires two repository secrets:
      #   CLOUDFLARE_API_TOKEN   - token with "Cloudflare Pages: Edit" permission
      #   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id
      # and a Pages project named "maicenta" (create it once in the dashboard or
      # with `npx wrangler pages project create maicenta`).
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=maicenta --branch=main
