[package]
name = "maicenta_bridge"
version = "0.1.0-beta.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
maicenta-application = { path = "../application" }
maicenta-dav-connector = { path = "../../connectors/dav" }
maicenta-domain = { path = "../domain" }
maicenta-graph-connector = { path = "../../connectors/microsoft_graph" }
maicenta-mail-connector = { path = "../../connectors/mail" }
maicenta-rendering = { path = "../rendering" }
maicenta-storage = { path = "../storage" }
maicenta-vault = { path = "../vault" }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde_json = "1.0.142"
velopack = "=1.2.161"
zeroize = "1.9.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
