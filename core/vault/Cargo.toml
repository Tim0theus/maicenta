[package]
name = "maicenta-vault"
version = "0.1.0"
description = "Encrypted profile keys, objects, and portable archives for MAICENTA."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
getrandom = "0.4.3"
hkdf = "0.12.4"
keyring = "4.1.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.16"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[lints]
workspace = true
